<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Outsmart the Pathfinder</title>
    <meta name="description" content="Build a voxel obstacle course and make an A* pathfinding bot think as hard as it can. Watch its search in 3D across an archipelago of floating islands." />
    <meta property="og:title" content="Outsmart the Pathfinder" />
    <meta property="og:description" content="Build a course that makes the pathfinding bot think as hard as it can." />
    <meta name="theme-color" content="#bcd3ea" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='18' rx='6' fill='%233b3355'/%3E%3Ccircle cx='16' cy='18' r='5.5' fill='%23fff'/%3E%3Ccircle cx='16' cy='18' r='2.6' fill='%233fd6f0'/%3E%3Crect x='15' y='3' width='2' height='6' fill='%233b3355'/%3E%3Ccircle cx='16' cy='3.5' r='2.2' fill='%23ff8f78'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff4e0; }
      canvas { display: block; touch-action: none; }
      .game-dialog { inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; box-sizing: border-box;
        margin: 0; padding: 0; border: 0; background: transparent; color: inherit; }
      .game-dialog[open] { display: grid; place-items: center; }
      .game-dialog::backdrop { background: #1d1a2c73; }
      .game-dialog :focus-visible { outline: 2px solid #5542c5; outline-offset: 3px; }
      #loading { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(ellipse at 50% 40%, #e9f2fb 0%, #bcd3ea 55%, #8fa9c8 100%);
        font: 600 14px/1.3 ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; color: #2f3550;
        transition: opacity .6s ease, visibility .6s; }
      #loading.done { opacity: 0; visibility: hidden; }
      #loading .card { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; text-align: center; }
      #loading h1 { margin: 0; font-size: 30px; letter-spacing: -.01em; }
      #loading .isle { width: 64px; height: 64px; position: relative; animation: float 2.4s ease-in-out infinite; }
      #loading .isle i { position: absolute; width: 20px; height: 20px; border-radius: 4px; }
      #loading .isle i:nth-child(1) { left: 2px; top: 22px; background: #7fae5b; }
      #loading .isle i:nth-child(2) { left: 22px; top: 22px; background: #8dbb66; }
      #loading .isle i:nth-child(3) { left: 42px; top: 22px; background: #7fae5b; }
      #loading .isle i:nth-child(4) { left: 12px; top: 42px; background: #9b7253; }
      #loading .isle i:nth-child(5) { left: 32px; top: 42px; background: #87634a; }
      #loading .isle i:nth-child(6) { left: 22px; top: 2px; background: #ff8a3c; border-radius: 10px; animation: hop 1.2s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @keyframes hop { 50% { transform: translateY(-6px); } }
      #loading .bar { width: 240px; height: 8px; border-radius: 4px; background: #ffffff80; overflow: hidden; }
      #loading .bar b { display: block; height: 100%; width: 0; border-radius: 4px; background: #3b3355; transition: width .25s ease; }
      #loading .msg { font-size: 12px; opacity: .65; min-height: 1.3em; }
      #loading.failed .bar { display: none; }
      #loading.failed .isle, #loading.failed .isle i { animation: none; }
      #loading.failed .msg { max-width: 36ch; font-size: 15px; opacity: 1; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="card">
        <div class="isle"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <h1>Outsmart the Pathfinder</h1>
        <div class="bar"><b></b></div>
        <div class="msg" role="status">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
